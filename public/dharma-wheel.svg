<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Dharma wheel">
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2d66a"/>
      <stop offset="0.45" stop-color="#d2a414"/>
      <stop offset="1" stop-color="#1f84ff"/>
    </linearGradient>
    <linearGradient id="spoke" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#fbf7ee"/>
      <stop offset="1" stop-color="#aeb2c5"/>
    </linearGradient>
  </defs>

  <!-- Outer rim -->
  <circle cx="64" cy="64" r="52" fill="none" stroke="url(#rim)" stroke-width="10" stroke-linecap="round"/>
  <circle cx="64" cy="64" r="40" fill="none" stroke="rgba(251,247,238,0.35)" stroke-width="2"/>

  <!-- Spokes (8) -->
  <g stroke="url(#spoke)" stroke-width="6" stroke-linecap="round">
    <line x1="64" y1="24" x2="64" y2="48"/>
    <line x1="64" y1="80" x2="64" y2="104"/>
    <line x1="24" y1="64" x2="48" y2="64"/>
    <line x1="80" y1="64" x2="104" y2="64"/>
    <line x1="36.7" y1="36.7" x2="53.3" y2="53.3"/>
    <line x1="74.7" y1="74.7" x2="91.3" y2="91.3"/>
    <line x1="36.7" y1="91.3" x2="53.3" y2="74.7"/>
    <line x1="74.7" y1="53.3" x2="91.3" y2="36.7"/>
  </g>

  <!-- Hub -->
  <circle cx="64" cy="64" r="14" fill="rgba(11,8,18,0.85)" stroke="rgba(251,247,238,0.35)" stroke-width="2"/>
  <circle cx="64" cy="64" r="5" fill="url(#rim)"/>
</svg>

